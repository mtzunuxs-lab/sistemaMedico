<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${hospital != null ? hospital.nombre : 'MediVida'} + ' - Dashboard'"></title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<div class="d-flex" style="min-height: 100vh;">
    <!-- Sidebar -->
    <aside class="bg-dark text-white p-3 d-flex flex-column" style="width: 260px; flex-shrink: 0;">
        <!-- Logo Header -->
        <a th:href="@{/dashboard}" class="d-flex align-items-center mb-3 text-white text-decoration-none">
            <img th:src="@{${hospital != null ? hospital.rutaLogo : '/images/logo.png'}}"
                 alt="Logo" width="40" height="40" class="me-2 rounded-circle bg-white p-1">
            <span class="fs-6 fw-bold text-truncate" th:text="${hospital != null ? hospital.nombre : 'MediVida'}"></span>
        </a>

        <hr class="border-secondary my-2">

        <!-- Opciones del Menú -->
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-1">
                <a th:href="@{/dashboard}" class="nav-link active">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item mb-1">
                <a th:href="@{/usuarios/listar}" class="nav-link text-white">
                    <i class="bi bi-people me-2"></i> Gestión Usuarios
                </a>
            </li>
            <li class="nav-item mb-1">
                <a th:href="@{/citas/agendar}" class="nav-link text-white">
                    <i class="bi bi-calendar-plus me-2"></i> Agendar Cita
                </a>
            </li>
        </ul>

        <hr class="border-secondary my-2">

        <!-- Logout -->
        <div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger w-100 btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </aside>

    <!-- Área de Contenido Principal -->
    <main class="flex-grow-1 p-4 bg-light">
        <div class="container-fluid">
            <!-- Banner / Mensaje de Bienvenida -->
            <div class="card border-0 shadow-sm p-4 text-center mb-4">
                <div class="mb-3">
                    <img th:src="@{${hospital != null ? hospital.rutaBanner : '/images/banner.png'}}"
                         alt="Banner Hospital" class="img-fluid rounded" style="max-height: 200px; width: 100%; object-fit: cover;">
                </div>
                <h2 class="text-primary fw-bold" th:text="'¡Bienvenido a ' + (${hospital != null ? hospital.nombre : 'MediVida'}) + '!'"></h2>
                <p class="text-secondary mb-0">Seleccione una opción del menú lateral para comenzar a operar en el sistema.</p>
            </div>
        </div>
    </main>
</div>

</body>
</html>
