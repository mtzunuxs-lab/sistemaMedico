<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${hospital != null ? hospital.nombre : 'MediVida'} + ' - Login'"></title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-lg border-0 p-4" style="max-width: 420px; width: 100%; border-radius: 12px;">
    <div class="text-center mb-4">
        <img th:src="@{${hospital != null ? hospital.rutaLogo : '/images/logo.png'}}"
             alt="Logo Hospital" class="img-fluid mb-3" style="max-height: 150px; object-fit: contain;">
        <h4 th:text="${hospital != null ? hospital.nombre : 'Hospital MediVida'}" class="fw-bold text-primary mb-1"></h4>
        <p class="text-muted small">Ingrese sus credenciales para acceder</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 text-center small mb-3">
        Usuario o contraseña incorrectos.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label text-secondary small fw-bold">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="Ingrese su usuario">
        </div>
        <div class="mb-4">
            <label for="password" class="form-label text-secondary small fw-bold">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Ingrese su contraseña">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Iniciar Sesión</button>
    </form>
</div>

</body>
</html>
