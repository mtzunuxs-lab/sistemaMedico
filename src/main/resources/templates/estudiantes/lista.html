<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Estudiantes</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Menú Lateral -->
<div th:replace="~{layout/sidebar :: menuLateral}"></div>

<!-- Contenido -->
<div class="content">
    <h2>Gestión de Estudiantes</h2>

    <!-- Formulario -->
    <form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{activo}" />

        <div class="form-group">
            <label>Carnet:</label><br>
            <input type="text" th:field="*{carnet}" placeholder="Ej. 2026-00123" required />
        </div>

        <div class="form-group">
            <label>Nombre:</label><br>
            <input type="text" th:field="*{nombre}" required />
        </div>

        <div class="form-group">
            <label>Apellido:</label><br>
            <input type="text" th:field="*{apellido}" required />
        </div>

        <div class="form-group">
            <label>Correo Electrónico:</label><br>
            <input type="email" th:field="*{email}" required />
        </div>

        <!-- Select de Carrera cargado desde Caché -->
        <div class="form-group">
            <label>Carrera:</label><br>
            <select th:field="*{carrera.id}" required style="padding: 8px; width: 270px;">
                <option value="">-- Seleccione una carrera --</option>
                <option th:each="c : ${carreras}"
                        th:value="${c.id}"
                        th:text="${c.nombre}">
                </option>
            </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button type="submit">
                <i class="fa-solid fa-floppy-disk"></i> Guardar
            </button>

            <a th:href="@{/estudiantes}" class="btn-clear">
                <i class="fa-solid fa-broom"></i> Limpiar
            </a>
        </div>
    </form>

    <hr style="margin-top: 30px;">

    <!-- Tabla -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Carnet</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Correo Electrónico</th>
            <th>Carrera</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${estudiantes}">
            <td th:text="${e.id}">1</td>
            <td th:text="${e.carnet}">2026-00123</td>
            <td th:text="${e.nombre}">Nombre</td>
            <td th:text="${e.apellido}">Apellido</td>
            <td th:text="${e.email}">correo@ejemplo.com</td>
            <td th:text="${e.carrera != null ? e.carrera.nombre : 'Sin asignación'}">Carrera</td>
            <td>
                <a th:href="@{/estudiantes/editar/{id}(id=${e.id})}" class="btn-edit">
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                </a>
                <a th:href="@{/estudiantes/eliminar/{id}(id=${e.id})}" class="btn-delete" onclick="return confirm('¿Desea dar de baja a este estudiante?')">
                    <i class="fa-solid fa-trash-can"></i> Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
