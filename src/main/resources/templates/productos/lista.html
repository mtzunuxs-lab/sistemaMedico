<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Productos</title>
    <!-- Vinculo al archivo CSS centralizado -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Menú Lateral -->
<div th:replace="~{layout/sidebar :: menuLateral}"></div>

<!-- Contenido -->
<div class="content">
    <h2>Gestión de Productos</h2>

    <!-- Formulario -->
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Nombre del producto:</label><br>
            <input type="text" th:field="*{nombre}" required />
        </div>

        <div class="form-group">
            <label>Precio:</label><br>
            <input type="number" step="0.01" th:field="*{precio}" required />
        </div>

        <button type="submit">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Producto
        </button>
        <a th:href="@{/productos}" class="btn-clear">
            <i class="fa-solid fa-broom"></i> Limpiar
        </a>
    </form>

    <hr style="margin-top: 30px;">

    <!-- Tabla -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.nombre}">Muestra</td>
            <td th:text="${'Q ' + p.precio}">0.00</td>
            <td>
                <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn-edit">
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                </a>
                <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" class="btn-delete" onclick="return confirm('¿Seguro que deseas eliminar este registro?')">
                    <i class="fa-solid fa-trash-can"></i> Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
